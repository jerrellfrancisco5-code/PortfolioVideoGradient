        { title: 'Welcome to Middle-earth', sub: 'Editorial product grid',
          body: ["The Middle-earth map became the compositional backbone of this section: a texture rather than a focal point, warm parchment tones grounding the product grid in the lore. I merchandised four hero SKUs across wildly different categories and made them coexist visually.", "Tight grid alignment and a consistent label treatment did the heavy lifting."],
          media: [['image-03211271-47c3-4056-ab50-590b98eeeb96.png', 727, 504]] },
        { title: 'One Collection to Rule Them All', sub: 'Scalable product card system',
          body: ["The carousel gave the merchandising team a scalable canvas for their top-performing SKUs. I designed a product card system flexible enough to hold everything from a mousepad to a statement jacket without breaking the layout.", "The Ringwraith-silhouette pattern tiled into the dark background was a compositing decision: subtle enough to feel like texture, recognizable enough to feel intentional."],

      accent: '#1f4fd6',
      facts: { Role: 'Creator, self-directed', Type: 'Concept festival brand, Cincinnati', Year: '2026' },
      tags: ['Brand Identity', 'Campaign', 'Environmental', 'Packaging', 'Merchandise', 'Social'],
      summary: ["Lévain is a self-directed brand experiment: a festival concept I built from the ground up to explore what identity design looks like with no guardrails and no client brief. The premise is a free food and cultural festival in Cincinnati, celebrating artisan baking, local makers and the communal act of breaking bread.", "The name comes from the French word for sourdough starter. I started making sourdough during the 2020 lockdown and never stopped, and the parallels between fermentation and design have never left me. You follow a process, you trust the timing, you don't rush the rise."],
      brief: [
        ['The question', 'What does a festival brand look like when the only brief is the work itself?'],
        ['My approach', 'One wordmark and a bold four-color system, tested across banners, billboards, packaging, merch and social.'],
        ['The result', 'It has been mistaken for a real client campaign in interviews.']
      ],
      sections: [
        { title: 'Brand identity', sub: 'Wordmark & color system',
          body: ["The wordmark is the system. Lévain is set in a high-contrast editorial serif that carries weight without shouting, and the accent over the É does real work, signaling something European, artisan, something that takes its time. The palette runs bold: cobalt blue, amber gold, deep forest green and a warm red that stops just short of aggressive.", "The same wordmark reads equally at home stamped on a paper cup, embroidered on a tote or hanging forty feet high between columns. That range was the goal from the start."],
          gif: ['Image-0b9d926d-1f08-4877-9920-76d2de0366d2.gif', 976, 423] },
        { title: 'Campaign & environmental', sub: 'A civic event, imagined',
          body: ["The campaign imagines Lévain as a real civic event, the kind of festival that takes over Washington Park for a day and feels like it's been happening for years. Column banners in rotating colorways hang from a neoclassical façade. A red billboard announces the date with nothing but the wordmark and \"You're Invited.\"", "The invite card system of red, gold and blue tiles from a physical mailer to an Instagram post without losing anything. The identity doesn't need to be resized, it just needs to be repeated."],
          media: [['image-ebb9365f-27a2-40dd-b085-0946d3eebc35.jpg', 975, 387], ['image-797e201e-3e40-427f-a3d5-2a1030c32850.png', 976, 576], ['image-5d95975a-143e-44b0-9037-5bcd08d397f0.jpg', 976, 585]] },
        { title: 'Merchandise & packaging', sub: 'Packaging treated as media',
          body: ["The bread bag carries the wordmark and \"For Those Who Rise\" on a crinkled white ground, the kind of thing you'd actually keep. Paper cups read \"In Crust We Trust\" flipped and stacked, revealed only when you pull one from the sleeve. Mugs in red, forest green and amber extend the palette into something collectible.", "The tote carries a stacked monogram inside a black circle, a second identity within the system. The lanyard and credential badge confirm the whole thing: your name inside a Lévain badge is the moment a concept becomes a world."],
          pair: [['image-a4d4e071-a0ab-4d99-950f-4443fc3c1017.jpg', 430, 360], ['image-920e7acc-4f35-4440-9e8b-d077d4cfbf89.jpg', 541, 360]],
          media: [['image-4e612bfd-51d4-4d4a-a4a5-5ecece8d53df.jpg', 975, 603], ['image-6929b9c2-08e1-460a-8dc6-e9ca071bb59a.jpg', 975, 495], ['image-6871a5f6-ccf1-4e72-b0c0-48a55343a1c7.jpg', 976, 360], ['image-8346d092-bcb7-49bb-a044-9532b06204ee.jpg', 976, 495], ['image-b15ec244-e2b9-4cfa-922f-669721aef354.png', 976, 424]],
          pair2: [['image-7ac812d9-1c26-43da-81d9-27c66e26787e.jpg', 486, 360], ['image-6e2a411e-3b00-4c3e-9c13-94782fe3ad79.jpg', 485, 360]] }
      ],
      outcome: { title: 'Holding its own at every size.',
        body: ["Lévain became a full visual world: identity, environmental, packaging, merchandise and digital, built around a single idea that bread and design share the same logic.", "The system lives at every scale: a stamp on a paper cup and a banner between neoclassical columns, a social card and a billboard, a business card and a tote you'd actually carry. That range is what a real festival brand has to do."],
        quote: "The project has been mistaken for a real client campaign in interviews. That's the outcome." }
    },

        { title: 'Social media campaign', sub: 'A templated vendor card system',

<style id="jf-typo">
/* Francisco v2 — typography & layout refinements (Oct 2026).
   Sits after the main build so it wins without !important. Edit spacing here, not in the minified block above. */

/* rhythm tokens: label → headline is tight, headline → grey subhead is open, so each block reads as one unit */
#jf { --sp-label: clamp(12px, 1.1vw, 16px); --sp-sub: clamp(20px, 2.2vw, 30px); --sp-tight: 12px; }

/* no widows / orphans: balanced headings, "pretty" paragraphs (the script ties the last two words as a fallback) */
#jf h1, #jf h2, #jf h3, #jf h4, #jf .eyebrow, #jf .stat b, #jf .skills b, #jf .category { text-wrap: balance; }
#jf p, #jf dd, #jf blockquote, #jf .stat span, #jf .skills span, #jf .lead { text-wrap: pretty; }
#jf .nw { white-space: nowrap; font: inherit; color: inherit; letter-spacing: inherit; }
#jf .nw.loose { white-space: normal; }
#jf .tags.wrapped .tag { flex: 1 1 auto; justify-content: center; }
#jf .tile .meta > div { min-width: 0; }  /* card titles wrap beside the arrow instead of pushing past the card */
@media (max-width: 560px) { #jf .hub .tile .round { display: none; } }  /* tiny two-up cards: the whole card is the link, give the title the room */

/* grey subheads, one treatment everywhere */
#jf .category, #jf .positioning p { color: var(--muted); font-weight: 400; line-height: 1.55; letter-spacing: 0; }
#jf .category { font-size: clamp(16px, 1.3vw, 19px); max-width: 52ch; }

/* home: positioning block */
#jf .positioning { gap: 0; }
#jf .positioning .eyebrow { margin-bottom: var(--sp-label); }
#jf .positioning .h2 { max-width: 24ch; }
#jf .positioning p { margin-top: var(--sp-sub); max-width: 46ch; font-size: clamp(16px, 1.25vw, 18px); text-wrap: balance; }

/* section heads (Selected work, Work, About, Start with these) */
#jf .head-row .eyebrow { margin-bottom: var(--sp-label); }
#jf .about .h2 { margin-top: var(--sp-label); }
#jf .about .lead { margin-top: var(--sp-sub); }

/* work, project, about and contact page heads */
#jf .cs-head .category, #jf .ab-hero .category, #jf .ct .category { margin-top: var(--sp-sub); }
#jf .ab-hero .display { margin-top: clamp(18px, 2.4vw, 30px); }
#jf .ab-hero .category { max-width: 44ch; }
#jf .ct { gap: 0; }
#jf .ct .eyebrow { margin-bottom: var(--sp-label); }
#jf .ct .category { max-width: 46ch; }
#jf .ct .email { margin-top: clamp(30px, 3.4vw, 44px); }
#jf .ct .email + div { margin-top: 16px; }
#jf .deliv-grid .category { margin-top: var(--sp-tight); }

/* contact card */
#jf .contact { gap: 0; }
#jf .contact .eyebrow { margin-bottom: var(--sp-label); }
#jf .contact .email { margin-top: clamp(24px, 2.6vw, 32px); }
#jf .contact .links { margin-top: 18px; }

/* project cards: 16:10 suits the wide covers; each cover carries its own focal point (focus: in the data) */
#jf .tile .cover { aspect-ratio: 16 / 10; }

/* home statement: words roll up when the block scrolls into view; the gold words carry a slow metallic shimmer */
#jf .statement .big.roll { text-wrap: balance; }
#jf .statement .big .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0.06em 0.02em 0.08em; margin: -0.06em -0.02em -0.08em; }
#jf .statement .big .wi { display: inline-block; transform: translateY(115%); transition: transform 0.95s cubic-bezier(0.2, 0.7, 0.2, 1); transition-delay: var(--d, 0ms); will-change: transform; }
#jf .statement.in .big .wi { transform: none; }
#jf .statement .big em { font-style: normal; color: var(--gold); }
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  #jf .statement .big em .wi { color: transparent; background: linear-gradient(100deg, #8a6a2c 0%, #c9a24b 30%, #f6e7b4 50%, #c9a24b 70%, #8a6a2c 100%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; animation: jfshimmer 5.2s linear infinite; animation-delay: var(--d, 0ms); }
}
@keyframes jfshimmer { 0% { background-position: 120% 0; } 100% { background-position: -140% 0; } }
@media (prefers-reduced-motion: reduce) { #jf .statement .big .wi { transform: none; transition: none; animation: none; } }

/* mosaic: a 12-column unit grid; every tile snaps to the same columns and rows, cropped tiles open full size in the lightbox */
#jf .mg { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: var(--u, 80px); gap: 12px; }
#jf .mg .fig { margin: 0; min-height: 0; min-width: 0; }
#jf .mg .fig img, #jf .mg .fig video { width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 50% 50%); display: block; }
#jf .fig.vid { cursor: default; background: #15120f; }
#jf .fig.vid.play { cursor: pointer; }
@media (max-width: 760px) {
  #jf .mg { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; }
  #jf .mg .fig { grid-column: auto / span 1 !important; grid-row: auto !important; aspect-ratio: 1 / 1; }
  #jf .mg .fig.w2 { grid-column: 1 / -1 !important; aspect-ratio: var(--mar, 3 / 2); }
}


/* client logos: one slot per logo, identical gaps all the way round the loop */
#jf .marquee { --lh: clamp(20px, 2vw, 28px); --gap: calc(var(--lh) * 2.6); }
#jf .marquee .track { gap: 0; }
#jf .marquee .set { display: flex; align-items: center; flex: none; }
#jf .marquee .logo { flex: none; display: block; height: var(--lh); width: calc(var(--lh) * var(--w) / var(--sh));
  margin-right: var(--gap); background-repeat: no-repeat; background-size: auto 100%;
  background-position: calc(var(--lh) * var(--x) / var(--sh) * -1) 0; opacity: .78; }

</style>
